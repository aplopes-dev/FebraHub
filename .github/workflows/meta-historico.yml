# FebraHub · .github/workflows/meta-historico.yml
#
# Carga histórica do Meta Ads (2024 em diante). Roda só manualmente,
# pelo botão Run workflow. Depois de rodar uma vez, o sync diário
# (no sync-diario.yml) mantém atualizado.
#
# SECRETS NECESSÁRIOS:
#   FEBRAHUB_ETL_TOKEN     token de máquina da API (só abre /ingest)
#   META_TOKEN, META_ACCOUNT_ID
#
# VARIABLE (ou secret):
#   FEBRAHUB_API_URL       ex.: https://febracis.aplopes.com/api
#
# O QUE SAIU: SUPABASE_URL / SUPABASE_SERVICE_KEY.

name: Meta Ads — carga histórica

on:
  workflow_dispatch:
    inputs:
      desde:
        description: 'Data inicial (AAAA-MM-DD)'
        required: true
        default: '2024-01-01'
      ate:
        description: 'Data final (AAAA-MM-DD)'
        required: true
        default: '2024-06-30'

jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Carga histórica Meta
        env:
          FEBRAHUB_API_URL: ${{ vars.FEBRAHUB_API_URL || secrets.FEBRAHUB_API_URL }}
          FEBRAHUB_ETL_TOKEN: ${{ secrets.FEBRAHUB_ETL_TOKEN }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_ACCOUNT_ID: ${{ secrets.META_ACCOUNT_ID }}
          # As datas vêm da UI: passar por env em vez de interpolar direto no
          # `run:` evita que um valor colado no formulário vire comando.
          DESDE: ${{ github.event.inputs.desde }}
          ATE: ${{ github.event.inputs.ate }}
        # meta_sync.py e febrahub_cliente.py usam só a biblioteca padrão —
        # por isso este workflow não precisa de pip install.
        run: python etl/meta_sync.py --desde "$DESDE" --ate "$ATE"
