# ⚠️ AGENDAMENTO DESLIGADO EM 01/08/2026.
#
# As integrações passaram a rodar dentro da VPS (cron + infra/scripts/sync.sh).
# Este workflow fica como plano B MANUAL, acionável por workflow_dispatch.
#
# O agendamento não pode voltar enquanto a VPS estiver ativa: o refresh token
# do Conta Azul é rotativo e de uso único, e dois lugares renovando o mesmo
# token derrubam um ao outro. Foi exatamente assim que a integração quebrou —
# o run das 10:24 consumiu o token que a VPS tinha, e o `continue-on-error`
# marcou o passo como sucesso.
#
# Ver docs/ETLS.md.

# FebraHub · .github/workflows/sync-salesforce.yml
#
# Lê os relatórios do Salesforce que chegam por e-mail (Gmail) e atualiza
# fato_pagamento_base e fato_base_alunos. Roda 3x/dia, pouco depois de cada
# disparo agendado do Salesforce (06h, 12h, 17h Salvador).
#
# Separado do sync-diario para não re-executar CisPay/Sympla/etc 3x ao dia.
#
# COMO FUNCIONA (e por que é seguro agora):
#   - o relatório do Salesforce filtra por DATA DE APROVAÇÃO
#   - o script apaga e reinsere pela MESMA data de aprovação
#   - critério igual dos dois lados = nenhuma linha órfã, nenhuma duplicata
#   (foi o descasamento aprovação x pagamento que quebrou a base antes)
#
# TRAVA: se a janela do arquivo passar de 120 dias, o script ABORTA em vez
# de apagar — protege contra subir um export de base inteira por engano.
# A API tem a sua própria trava (366 dias) e recusa DELETE sem recorte de
# data: o token de ETL não é suficiente para apagar histórico.
#
# SECRETS NECESSÁRIOS:
#   FEBRAHUB_ETL_TOKEN                  token de máquina da API
#   GMAIL_ADDRESS, GMAIL_APP_PASSWORD   (senha de APP, não a senha real)
#   SF_ASSUNTO_PAGAMENTO  (opcional, padrão 'Base pagamentos')
#   SF_ASSUNTO_ALUNOS     (opcional, padrão 'Base alunos')
#
# VARIABLE (ou secret):
#   FEBRAHUB_API_URL                    ex.: https://febracis.aplopes.com/api
#
# O QUE SAIU: SUPABASE_URL / SUPABASE_SERVICE_KEY (a service_role ignorava
# toda a RLS — era o banco inteiro num secret).

name: Sync Salesforce (e-mail)

on:
  # schedule:   # desligado: ver nota no topo
  # - cron: '15 9 * * *'    # 06:15 Salvador (após disparo das 06h)
  # - cron: '15 15 * * *'   # 12:15 Salvador (após disparo das 12h)
  # - cron: '15 20 * * *'   # 17:15 Salvador (após disparo das 17h)
  workflow_dispatch:

env:
  FEBRAHUB_API_URL: ${{ vars.FEBRAHUB_API_URL || secrets.FEBRAHUB_API_URL }}
  FEBRAHUB_ETL_TOKEN: ${{ secrets.FEBRAHUB_ETL_TOKEN }}

jobs:
  salesforce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r etl/requirements.txt

      - name: Salesforce (e-mail)
        id: sf
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SF_ASSUNTO_PAGAMENTO: ${{ secrets.SF_ASSUNTO_PAGAMENTO }}
          SF_ASSUNTO_ALUNOS: ${{ secrets.SF_ASSUNTO_ALUNOS }}
        run: python etl/salesforce_email_sync.py
        continue-on-error: true

      # O script já registra 'ok' quando conclui; este passo existe para
      # marcar o ERRO — sem ele, uma falha deixaria o painel com a data da
      # última execução boa, dando a impressão de que tudo está em dia.
      - name: Status — Salesforce
        if: always()
        env:
          RESULTADO: ${{ steps.sf.outcome }}
        run: |
          curl -sS -X POST "$FEBRAHUB_API_URL/ingest/status/registrar" \
            -H "X-ETL-Token: $FEBRAHUB_ETL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"fonte\":\"salesforce\",\"nome_exibicao\":\"Salesforce\",\"status\":\"$([ "$RESULTADO" = success ] && echo ok || echo erro)\"}"
