name: imoveis

services:
  api:
    build:
      context: ../../..
      dockerfile: apps/imoveis/api/Dockerfile
      args:
        CACHEBUST: ${CACHEBUST:-unknown}
    image: aplopes-imoveis-api:latest
    container_name: imoveis_api
    restart: unless-stopped
    env_file:
      - ../../../services/platform-apps.env
    environment:
      NODE_ENV: production
      AUTH_DEV_BYPASS: "false"
      PORT: 3112
      DATABASE_URL: ${IMOVEIS_DATABASE_URL_DOCKER}
      KEYCLOAK_ISSUER: ${KEYCLOAK_IMOVEIS_ISSUER:-https://auth.aplopes.com/realms/citybox-imoveis}
      KEYCLOAK_CLIENT_ID: imoveis-web
      KEYCLOAK_ALLOWED_AZP: imoveis-web,admin-m2m
      KEYCLOAK_PROVISIONING_CLIENT_ID: imoveis-provisioning
      KEYCLOAK_PROVISIONING_CLIENT_SECRET: ${KEYCLOAK_IMOVEIS_PROVISIONING_SECRET:-imoveis-provisioning-dev-secret}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://citybox:citybox@aplopes_rabbitmq:5672/citybox}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-aplopes}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-aplopes-minio-dev}
      MINIO_BUCKET: ${IMOVEIS_MINIO_BUCKET:-citybox-imoveis}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://imoveis.aplopes.com,https://backoffice.aplopes.com,https://admin.aplopes.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      IMOVEIS_WEB_URL: ${IMOVEIS_WEB_URL:-https://imoveis.aplopes.com}
    ports:
      - "127.0.0.1:3112:3112"
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3112/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - aplopes-platform

  # Frontend Next.js (@citybox/imoveis-web) — BFF próprio + proxy /api/proxy/imoveis
  web:
    build:
      context: ../../..
      dockerfile: apps/imoveis/web/Dockerfile
      args:
        CACHEBUST: ${CACHEBUST:-unknown}
        NEXT_PUBLIC_KEYCLOAK_ISSUER: ${KEYCLOAK_IMOVEIS_ISSUER:-https://auth.aplopes.com/realms/citybox-imoveis}
        NEXT_PUBLIC_KEYCLOAK_CLIENT: imoveis-web
        NEXT_PUBLIC_BACKOFFICE_ORIGIN: ${IMOVEIS_ORIGIN:-https://imoveis.aplopes.com}
        NEXT_PUBLIC_IMOVEIS_API_URL: ${NEXT_PUBLIC_IMOVEIS_API_URL:-https://imoveis.aplopes.com/api}
        NEXT_PUBLIC_IMOVEIS_STORE_ID: ${IMOVEIS_STORE_ID:-}
        NEXT_PUBLIC_APP_URL: ${IMOVEIS_ORIGIN:-https://imoveis.aplopes.com}
    image: aplopes-imoveis-web:latest
    container_name: imoveis_web
    restart: unless-stopped
    env_file:
      - ../../../services/platform-apps.env
    environment:
      NODE_ENV: production
      PORT: 3111
      HOSTNAME: "0.0.0.0"
      IMOVEIS_API_URL: http://api:3112/api
      IMOVEIS_STORE_ID: ${IMOVEIS_STORE_ID:-}
      KEYCLOAK_INTERNAL_ISSUER: http://aplopes_keycloak:8080/realms/citybox-imoveis
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_IMOVEIS_WEB_SECRET:-imoveis-web-dev-secret}
    ports:
      - "127.0.0.1:3111:3111"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - aplopes-platform

networks:
  aplopes-platform:
    name: aplopes-platform
    external: true
