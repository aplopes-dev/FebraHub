services:
  web-dev:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  web:
    build:
      context: .
      target: production
    ports:
      - "8080:80"
    restart: unless-stopped
