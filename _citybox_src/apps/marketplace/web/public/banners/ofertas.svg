<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Banner de ofertas CityBox">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052e22"/>
      <stop offset="0.45" stop-color="#06603f"/>
      <stop offset="0.78" stop-color="#0a8f54"/>
      <stop offset="1" stop-color="#053a2a"/>
    </linearGradient>
    <radialGradient id="glowAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLime" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCoral" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="tagShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <circle cx="3" cy="3" r="2" fill="#ffffff" fill-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- soft color bokeh (right-weighted) -->
  <circle cx="880" cy="110" r="190" fill="url(#glowAmber)" filter="url(#soft)"/>
  <circle cx="1120" cy="300" r="220" fill="url(#glowLime)" filter="url(#soft)"/>
  <circle cx="700" cy="350" r="170" fill="url(#glowCyan)" filter="url(#soft)"/>
  <circle cx="1040" cy="40" r="150" fill="url(#glowCoral)" filter="url(#soft)"/>

  <!-- dotted texture, fading in from the right -->
  <rect x="620" y="0" width="580" height="420" fill="url(#dots)" opacity="0.12"/>

  <!-- big translucent percent mark -->
  <text x="930" y="332" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="430" font-weight="800" fill="#ffffff" fill-opacity="0.07">%</text>

  <!-- diagonal light streaks -->
  <g opacity="0.5">
    <rect x="240" y="-120" width="60" height="680" transform="rotate(20 270 210)" fill="url(#sheen)"/>
    <rect x="360" y="-120" width="26" height="680" transform="rotate(20 373 210)" fill="url(#sheen)"/>
  </g>

  <!-- price tag emblem -->
  <g transform="rotate(-16 980 210)" filter="url(#tagShadow)">
    <path d="M 902 96 L 1066 96 A 26 26 0 0 1 1092 122 L 1092 250 A 26 26 0 0 1 1066 276 L 938 276 A 36 36 0 0 1 912 265 L 832 185 A 30 30 0 0 1 832 143 L 884 104 A 22 22 0 0 1 902 96 Z" fill="url(#tag)"/>
    <circle cx="878" cy="158" r="20" fill="#053a2a"/>
    <circle cx="878" cy="158" r="7" fill="#fde68a"/>
    <text x="1008" y="208" text-anchor="middle" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="86" font-weight="800" fill="#053a2a">%</text>
  </g>

  <!-- floating sparkles -->
  <g fill="#ffffff">
    <g transform="translate(720 120)" opacity="0.9">
      <path d="M0 -13 C2 -4 4 -2 13 0 C4 2 2 4 0 13 C-2 4 -4 2 -13 0 C-4 -2 -2 -4 0 -13 Z"/>
    </g>
    <g transform="translate(1120 150) scale(0.7)" opacity="0.8">
      <path d="M0 -13 C2 -4 4 -2 13 0 C4 2 2 4 0 13 C-2 4 -4 2 -13 0 C-4 -2 -2 -4 0 -13 Z"/>
    </g>
    <g transform="translate(640 250) scale(0.55)" opacity="0.75">
      <path d="M0 -13 C2 -4 4 -2 13 0 C4 2 2 4 0 13 C-2 4 -4 2 -13 0 C-4 -2 -2 -4 0 -13 Z"/>
    </g>
  </g>

  <!-- thin accent rings -->
  <circle cx="1140" cy="90" r="46" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="600" cy="60" r="10" fill="#fbbf24" fill-opacity="0.85"/>
  <circle cx="780" cy="380" r="8" fill="#a3e635" fill-opacity="0.9"/>

  <!-- subtle vignette for text legibility on the left -->
  <rect width="620" height="420" fill="#000000" fill-opacity="0.12"/>
</svg>
