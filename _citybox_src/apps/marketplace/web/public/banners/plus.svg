<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Banner CityBox+ assinatura">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1230"/>
      <stop offset="0.5" stop-color="#13224f"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="pGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fcd34d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fcd34d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plusFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="pSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="psoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="pShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <pattern id="pgrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 H0 V44" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#pbg)"/>

  <!-- color bokeh, right-weighted -->
  <circle cx="900" cy="120" r="200" fill="url(#pGreen)" filter="url(#psoft)"/>
  <circle cx="1130" cy="320" r="210" fill="url(#pTeal)" filter="url(#psoft)"/>
  <circle cx="1030" cy="60" r="150" fill="url(#pGold)" filter="url(#psoft)"/>

  <!-- faint grid on the right -->
  <rect x="640" y="0" width="560" height="420" fill="url(#pgrid)" opacity="0.07"/>

  <!-- diagonal sheen -->
  <g opacity="0.5">
    <rect x="300" y="-120" width="54" height="680" transform="rotate(20 327 210)" fill="url(#pSheen)"/>
    <rect x="410" y="-120" width="22" height="680" transform="rotate(20 421 210)" fill="url(#pSheen)"/>
  </g>

  <!-- giant translucent plus -->
  <g fill="#ffffff" fill-opacity="0.06">
    <rect x="1010" y="70" width="70" height="290" rx="20"/>
    <rect x="900" y="180" width="290" height="70" rx="20"/>
  </g>

  <!-- premium membership card -->
  <g transform="rotate(-14 950 215)" filter="url(#pShadow)">
    <rect x="812" y="120" width="282" height="184" rx="26" fill="url(#cardFill)"/>
    <rect x="812" y="120" width="282" height="184" rx="26" fill="url(#pSheen)"/>
    <rect x="842" y="160" width="58" height="42" rx="8" fill="#92400e" fill-opacity="0.55"/>
    <rect x="842" y="232" width="220" height="12" rx="6" fill="#7c2d12" fill-opacity="0.35"/>
    <rect x="842" y="256" width="150" height="12" rx="6" fill="#7c2d12" fill-opacity="0.3"/>
    <text x="1064" y="170" text-anchor="end" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="34" font-weight="800" fill="#053a2a">+</text>
  </g>

  <!-- bold plus emblem -->
  <g transform="rotate(8 700 150)" filter="url(#pShadow)">
    <g fill="url(#plusFill)">
      <rect x="676" y="92" width="48" height="120" rx="16"/>
      <rect x="640" y="128" width="120" height="48" rx="16"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#ffffff">
    <g transform="translate(1140 120) scale(0.8)" opacity="0.9">
      <path d="M0 -13 C2 -4 4 -2 13 0 C4 2 2 4 0 13 C-2 4 -4 2 -13 0 C-4 -2 -2 -4 0 -13 Z"/>
    </g>
    <g transform="translate(820 360) scale(0.6)" opacity="0.8">
      <path d="M0 -13 C2 -4 4 -2 13 0 C4 2 2 4 0 13 C-2 4 -4 2 -13 0 C-4 -2 -2 -4 0 -13 Z"/>
    </g>
  </g>

  <circle cx="600" cy="70" r="9" fill="#fcd34d" fill-opacity="0.85"/>
  <circle cx="1160" cy="240" r="7" fill="#34d399" fill-opacity="0.9"/>
  <circle cx="1080" cy="360" r="40" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>

  <!-- left vignette for text legibility -->
  <rect width="600" height="420" fill="#000000" fill-opacity="0.12"/>
</svg>
