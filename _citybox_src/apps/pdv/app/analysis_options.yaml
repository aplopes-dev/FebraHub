include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Um widget sem const é custo de rebuild, não estilo. Trate como erro.
    prefer_const_constructors: error
    prefer_const_literals_to_create_immutables: error
    prefer_const_declarations: error
    avoid_print: error
    always_declare_return_types: error

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # --- Imutabilidade e segurança de tipos ---
    prefer_final_locals: true
    prefer_final_in_for_each: true
    avoid_dynamic_calls: true
    use_super_parameters: true

    # --- Widgets ---
    use_key_in_widget_constructors: true
    sized_box_for_whitespace: true
    avoid_unnecessary_containers: true
    use_colored_box: true
    use_decorated_box: true

    # --- Async ---
    unawaited_futures: true
    avoid_void_async: true
    use_build_context_synchronously: true

    # --- Organização ---
    # `directives_ordering` fica DESLIGADO de propósito. Ele exige uma única
    # lista alfabética, o que joga `package:citybox_pdv/...` acima de
    # `package:flutter/...`. Adotamos o agrupamento usual de apps Flutter, que
    # diz de onde a dependência vem antes de dizer como se chama:
    #   1. dart:*   2. package:flutter/*   3. pacotes de terceiros   4. projeto
    # Cada bloco em ordem alfabética, separado por linha em branco.
    directives_ordering: false
    always_use_package_imports: true

    # --- Legibilidade ---
    require_trailing_commas: true
    curly_braces_in_flow_control_structures: true
    prefer_single_quotes: true
