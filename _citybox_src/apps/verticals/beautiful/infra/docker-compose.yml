name: beautiful

services:
  api:
    build:
      context: ../../../..
      dockerfile: apps/verticals/beautiful/api/Dockerfile
      args:
        CACHEBUST: ${CACHEBUST:-unknown}
    image: aplopes-beautiful-api:latest
    container_name: beautiful_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${BEAUTIFUL_DATABASE_URL_DOCKER:-postgresql://citybox:citybox@aplopes_postgres:5432/citybox?schema=beautiful}
      # Realm próprio do Beautiful (ADR C-16) — issuer único, sem fallback
      KEYCLOAK_ISSUER: ${KEYCLOAK_BEAUTIFUL_ISSUER:-https://auth.aplopes.com/realms/citybox-beautiful}
      KEYCLOAK_CLIENT_ID: beautiful-web
      KEYCLOAK_ALLOWED_AZP: beautiful-web,admin-m2m
      KEYCLOAK_PROVISIONING_CLIENT_ID: beautiful-provisioning
      KEYCLOAK_PROVISIONING_CLIENT_SECRET: ${KEYCLOAK_BEAUTIFUL_PROVISIONING_SECRET:-beautiful-provisioning-dev-secret}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://citybox:citybox@aplopes_rabbitmq:5672/citybox}
      # Produção: sem bypass e sem CORS browser→Nest (web só via BFF)
      AUTH_DEV_BYPASS: "false"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-citybox}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-citybox-minio-dev}
      MINIO_BUCKET: citybox-beautiful
      PORT: 3173
    ports:
      - "127.0.0.1:3173:3173"
    networks:
      - aplopes-platform

  # Frontend Next.js — BFF próprio + proxy /api/proxy/beautiful
  web:
    build:
      context: ../../../..
      dockerfile: apps/verticals/beautiful/web/Dockerfile
      args:
        CACHEBUST: ${CACHEBUST:-unknown}
        NEXT_PUBLIC_KEYCLOAK_ISSUER: ${KEYCLOAK_BEAUTIFUL_ISSUER:-https://auth.aplopes.com/realms/citybox-beautiful}
        NEXT_PUBLIC_KEYCLOAK_CLIENT: beautiful-web
        NEXT_PUBLIC_BACKOFFICE_ORIGIN: ${BEAUTIFUL_ORIGIN:-https://salao.aplopes.com}
    image: aplopes-beautiful-web:latest
    container_name: beautiful_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3115
      HOSTNAME: "0.0.0.0"
      BEAUTIFUL_API_URL: http://api:3173/api
      KEYCLOAK_INTERNAL_ISSUER: http://aplopes_keycloak:8080/realms/citybox-beautiful
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_BEAUTIFUL_WEB_SECRET:-beautiful-web-dev-secret}
    ports:
      # Host 3118: neste VPS a 3115 já é do CRM (`crm.aplopes.com`). App continua em PORT=3115 no container.
      - "127.0.0.1:3118:3115"
    depends_on:
      - api
    networks:
      - aplopes-platform

networks:
  aplopes-platform:
    name: aplopes-platform
    external: true
