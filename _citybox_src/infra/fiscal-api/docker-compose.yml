services:
  fiscal-api:
    build:
      # Contexto é a raiz do monorepo — o Dockerfile copia pnpm-workspace.yaml/pnpm-lock.yaml.
      context: ../..
      dockerfile: services/fiscal-api/Dockerfile
      args:
        CACHEBUST: ${CACHEBUST:-unknown}
    image: citybox-fiscal-api:latest
    container_name: citybox_fiscal_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Padrao PRODUCTION de proposito: junto com AUTH_DEV_BYPASS vazio, desliga
      # duas vezes o token `dev-admin` do AuthGuard. Para testar pelo Swagger sem
      # Keycloak, defina as duas no `.env` local (que o git ignora):
      #   FISCAL_NODE_ENV=development
      #   AUTH_DEV_BYPASS=true
      # NUNCA em ambiente compartilhado: `dev-admin` entra como `platform_admin`,
      # que passa por cima da checagem de acesso ao Emitente.
      NODE_ENV: ${FISCAL_NODE_ENV:-production}
      AUTH_DEV_BYPASS: ${AUTH_DEV_BYPASS:-}
      PORT: 3116
      # Banco compartilhado `citybox` (container citybox_postgres, porta interna 5432),
      # schema próprio `fiscal`. Requer que a migration já tenha sido aplicada — ver README.
      DATABASE_URL: postgresql://${POSTGRES_USER:-citybox}:${POSTGRES_PASSWORD:-citybox}@citybox_postgres:5432/${FISCAL_DB_NAME:-citybox}?schema=fiscal
      # ADR C-16: sem realm próprio — lista fechada dos realms consumidores.
      KEYCLOAK_ALLOWED_ISSUERS: ${KEYCLOAK_ALLOWED_ISSUERS:-http://citybox_keycloak:8080/realms/citybox-erp}
      KEYCLOAK_ALLOWED_AZP: ${KEYCLOAK_ALLOWED_AZP:-fiscal-m2m}
      # Bucket `fiscal` já é criado pelo init de infra/minio.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-citybox_minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-aplopes}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-citybox-minio-dev}
      MINIO_BUCKET: ${MINIO_BUCKET:-fiscal}
      MINIO_USE_SSL: "false"
      FISCAL_CERT_ENCRYPTION_KEY: ${FISCAL_CERT_ENCRYPTION_KEY}
      SEFAZ_BA_NFE_HOMOLOGATION_ENDPOINT: ${SEFAZ_BA_NFE_HOMOLOGATION_ENDPOINT:-https://hnfe.sefaz.ba.gov.br}
      # ─── Cupom fiscal (NFC-e, spec 005) ───────────────────────────────────
      # Nao ha SEFAZ_BA_NFCE_ENDPOINT: a NFC-e usa o MESMO webservice e o MESMO
      # certificado da NF-e; o modelo muda dentro do XML.
      #
      # As duas URLs de consulta NAO tem valor padrao, de proposito: sao
      # estaduais, e apontar para o estado errado produz cupom autorizado com
      # QR Code que leva a lugar nenhum. Sem elas a emissao e recusada com 424.
      NFCE_QRCODE_URL_BA_HOMOLOGATION: ${NFCE_QRCODE_URL_BA_HOMOLOGATION:-}
      NFCE_CHAVE_URL_BA_HOMOLOGATION: ${NFCE_CHAVE_URL_BA_HOMOLOGATION:-}
      NFCE_CONSUMER_LIMIT_BA: ${NFCE_CONSUMER_LIMIT_BA:-}
      NFCE_CONTINGENCY_DEADLINE_HOURS: ${NFCE_CONTINGENCY_DEADLINE_HOURS:-}
      # ⚠️ Dreno automatico DESLIGADO por padrao: so e seguro com UMA instancia
      # da API, porque a fila ainda nao tem reivindicacao atomica.
      NFCE_CONTINGENCY_DRAIN: ${NFCE_CONTINGENCY_DRAIN:-off}
    ports:
      - "127.0.0.1:${FISCAL_API_PORT:-3116}:3116"
    healthcheck:
      # node -e/fetch em vez de curl/wget — mesmo padrão de infra/deploy/docker-compose.apps.yml
      # (a imagem runner é node:24-alpine e não traz curl).
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3116/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - citybox-platform

networks:
  citybox-platform:
    name: citybox-platform
    driver: bridge
