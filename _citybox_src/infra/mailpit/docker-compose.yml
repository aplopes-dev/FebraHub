# Captura local de e-mails (dev). SMTP :1025 · UI :8025
# Não precisa de autenticação. Use na imoveis-api:
#   SMTP_HOST=127.0.0.1
#   SMTP_PORT=1025
#   SMTP_SECURE=false
#   SMTP_FROM=noreply@citybox.local
services:
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: citybox_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - citybox-platform

networks:
  citybox-platform:
    name: citybox-platform
    external: true
