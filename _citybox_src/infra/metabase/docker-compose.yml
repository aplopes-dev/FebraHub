services:
  metabase:
    image: metabase/metabase:v0.53.4
    container_name: citybox_metabase
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MB_JETTY_PORT: 3000
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:-metabase}
      MB_DB_HOST: metabase-db
    ports:
      - "127.0.0.1:${METABASE_PORT:-3002}:3000"
    volumes:
      - citybox_metabase_data:/metabase-data
    depends_on:
      metabase-db:
        condition: service_healthy
    networks:
      - citybox-platform

  metabase-db:
    image: postgres:17-alpine
    container_name: citybox_metabase_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:-metabase}
      POSTGRES_DB: metabase
    volumes:
      - citybox_metabase_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - citybox-platform

volumes:
  citybox_metabase_data:
    name: citybox_metabase_data
  citybox_metabase_db_data:
    name: citybox_metabase_db_data

networks:
  citybox-platform:
    name: citybox-platform
    external: true
