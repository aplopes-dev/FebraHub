services:
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: citybox_minio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-citybox}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-citybox-minio-dev}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - citybox_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - citybox-platform

  minio-init:
    image: minio/mc:latest
    container_name: citybox_minio_init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/citybox-food;
      mc mb --ignore-existing local/erp;
      mc mb --ignore-existing local/citybox-imoveis;
      mc mb --ignore-existing local/fiscal;
      mc mb --ignore-existing local/citybox-beautiful;
      exit 0;
      "
    networks:
      - citybox-platform

volumes:
  citybox_minio_data:
    name: citybox_minio_data

networks:
  citybox-platform:
    name: citybox-platform
    external: true
