services:
  nginx:
    image: nginx:1.27-alpine
    container_name: citybox_nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      # Só o vhost de dev — prod-citybox.conf exige certificados Let's Encrypt
      # (/etc/letsencrypt) que não existem local e derrubam o nginx no boot.
      # Produção monta a conf.d inteira via docker-compose.certbot.yml.
      - ./conf.d/dev-local.conf:/etc/nginx/conf.d/dev-local.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
