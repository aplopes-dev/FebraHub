# Citybox Platform — core-api (:3101)
# ATENÇÃO: api.citybox.com pode estar em uso por flow-atendimento-ia.
# Desabilite o bloco conflitante antes de ativar este arquivo.

server {
    listen 80;
    server_name api.citybox.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.citybox.com;

    ssl_certificate /etc/letsencrypt/live/api.citybox.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.citybox.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Food vertical API (:3171) — backoffice NEXT_PUBLIC_FOOD_API_URL=/food/api
    location /food/api/ {
        include /etc/nginx/snippets/citybox-cors-platform-api.conf;

        client_max_body_size 15m;
        proxy_pass http://127.0.0.1:3171/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        include /etc/nginx/snippets/citybox-cors-platform-api.conf;

        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
