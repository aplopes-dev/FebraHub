# Citybox Platform — erp-web, backoffice de Comércio (:3107)
# Sucessor do antigo shell multi-vertical, removido em 2026-07-31 (ver apps/erp/AGENTS.md §9).
# HTTP sempre ativo; bloco SSL em backoffice.citybox.com.ssl.conf após certbot.

server {
    listen 80;
    server_name backoffice.citybox.com;

    # Uploads (logo clínica, fotos) via proxy /api/proxy/* — default nginx é 1m.
    client_max_body_size 15m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Buffers de request/response para cookies JWT do BFF
    proxy_buffer_size 128k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 512k;
    large_client_header_buffers 8 64k;

    location / {
        proxy_pass http://127.0.0.1:3107;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
