# erp-web, backoffice de Comércio — sucessor do antigo shell multi-vertical,
# removido em 2026-07-31 (ver apps/erp/AGENTS.md §9).
# Ativado por deploy-host-production.sh após certbot emitir backoffice.citybox.com

server {
    listen 443 ssl http2;
    server_name backoffice.citybox.com;

    ssl_certificate /etc/letsencrypt/live/backoffice.citybox.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backoffice.citybox.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Uploads (logo clínica, fotos) via proxy /api/proxy/* — default nginx é 1m.
    client_max_body_size 15m;

    # Buffers de request para cookies JWT volumosos (browser → nginx)
    # e buffers de response para Set-Cookie do BFF (nginx → browser)
    proxy_buffer_size 128k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 512k;
    large_client_header_buffers 8 64k;

    location / {
        proxy_pass http://127.0.0.1:3107;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
