# fiscal-api (:3116 dentro do container) — gateway público TEMPORÁRIO por
# IP:porta, sem TLS.
#
# Motivo: acessar o Swagger (`/api/v1/docs`) de fora da VPS enquanto não há
# subdomínio + certificado dedicados (ver README.md — produção "de verdade"
# usa domínio + Certbot, não IP cru; não há registro DNS para um subdomínio
# fiscal.aplopes.com hoje).
#
# Porta pública é 8116, NÃO 3116/3117/3121: nesta VPS (produção aplopes, real,
# 2026-08-10 — divergente do infra/fiscal-api/docker-compose.yml deste repo,
# que não é o compose usado aqui):
#   - 3116 já está ocupada por `crm_aplopes_api` (outro produto, não fiscal-api);
#   - 3117 já está ocupada por `crm_aplopes_minio`;
#   - o container real é subido por `services/platform/docker-compose.yml`
#     (serviço `fiscal-api`, container `aplopes_fiscal_api`), que publicava
#     `127.0.0.1:3121:3121` — bug corrigido em 2026-08-10 para
#     `127.0.0.1:3121:3116` (a app só escuta em 3116 dentro do container,
#     `PORT=3116`; o publish antigo apontava pra uma porta em que nada
#     escutava e dava connection reset). Reaplicado com
#     `docker compose --env-file ../platform-apps.env up -d --no-deps fiscal-api`
#     a partir de `services/platform/`.
#
# Proxy usa 127.0.0.1:3121 (porta publicada pelo Docker, estável entre
# restarts/recreate do container) — não o IP interno do container na rede
# bridge, que muda a cada recriação.
#
# ⚠️ Isto expõe TODA a superfície da fiscal-api (Swagger + rotas) publicamente,
# sem HTTPS. Remova este vhost (ou substitua por domínio+TLS, ver
# host/api.citybox.com.conf) assim que o acesso deixar de ser necessário.
#
# Deploy no host (system nginx real da VPS, não o nginx dockerizado deste
# diretório — infra/nginx/docker-compose.yml não está em uso em produção):
#   sudo cp infra/nginx/host/fiscal-api-public.conf /etc/nginx/sites-available/fiscal-api-public.conf
#   sudo ln -sf /etc/nginx/sites-available/fiscal-api-public.conf /etc/nginx/sites-enabled/fiscal-api-public.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo ufw allow 8116/tcp comment 'fiscal-api swagger temp public'
#
# `ufw` nesta VPS é `policy DROP` por padrão — sem a regra acima o vhost
# funciona só localmente (curl do próprio host passa; cliente externo não).
# Existe uma regra antiga `3116/tcp ... # citybox fiscal-api temp test` no ufw
# que ficou órfã (3116 hoje pertence a outro app, ligado só em 127.0.0.1) —
# não removi por não ser deste vhost; avaliar remoção depois.
#
# Remoção:
#   sudo rm /etc/nginx/sites-enabled/fiscal-api-public.conf
#   sudo systemctl reload nginx
#   sudo ufw delete allow 8116/tcp

server {
    listen 8116;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3121;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
