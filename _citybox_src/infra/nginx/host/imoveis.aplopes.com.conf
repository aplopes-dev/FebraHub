# Aplopes Platform — imoveis-web (:3111) + imoveis-api (:3112) em /api/v1 e /api/health
# BFF Next.js: /api/auth/*, /api/proxy/imoveis/*, /api/public/* → web
# Nest público: /api/v1/* (catálogo client-side via NEXT_PUBLIC_IMOVEIS_API_URL)

server {
    listen 80;
    listen [::]:80;
    server_name imoveis.aplopes.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name imoveis.aplopes.com;

    ssl_certificate /etc/letsencrypt/live/imoveis.aplopes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imoveis.aplopes.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Uploads (fotos/documentos) via proxy /api/*
    client_max_body_size 50m;

    proxy_buffer_size 128k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 512k;
    large_client_header_buffers 8 64k;

    # NestJS imoveis-api (health + rotas /api/v1/*)
    location /api/health {
        proxy_pass http://127.0.0.1:3112;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:3112;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Next.js imoveis-web (BFF auth/proxy/public + páginas)
    location / {
        proxy_pass http://127.0.0.1:3111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
