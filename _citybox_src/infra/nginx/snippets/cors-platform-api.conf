# CORS preflight (OPTIONS) — respostas reais ficam no core-api (enableCors)
set $aplopes_cors_origin "";
if ($http_origin ~* "^https://(backoffice|admin|app|city)\.aplopes\.com$") {
    set $aplopes_cors_origin $http_origin;
}
if ($http_origin ~* "^http://(localhost|127\.0\.0\.1)(:[0-9]+)?$") {
    set $aplopes_cors_origin $http_origin;
}

if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin $aplopes_cors_origin;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Store-Id";
    add_header Access-Control-Max-Age 86400;
    add_header Content-Length 0;
    return 204;
}
