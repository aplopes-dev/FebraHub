services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: citybox_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-citybox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citybox}
      POSTGRES_DB: ${POSTGRES_DB:-campinas_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - citybox_postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-citybox} -d ${POSTGRES_DB:-campinas_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - citybox-platform

volumes:
  citybox_postgres_data:
    name: citybox_postgres_data

networks:
  citybox-platform:
    name: citybox-platform
    driver: bridge
