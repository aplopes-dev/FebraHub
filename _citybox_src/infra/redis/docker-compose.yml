services:
  redis:
    image: redis:8-alpine
    container_name: citybox_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - citybox_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - citybox-platform

volumes:
  citybox_redis_data:
    name: citybox_redis_data

networks:
  citybox-platform:
    name: citybox-platform
    external: true
