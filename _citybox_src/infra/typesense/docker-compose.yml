services:
  typesense:
    image: typesense/typesense:30.2
    container_name: citybox_typesense
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-citybox-dev-typesense-key}
      TYPESENSE_ENABLE_CORS: "true"
    ports:
      - "127.0.0.1:${TYPESENSE_PORT:-8108}:8108"
    volumes:
      - citybox_typesense_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8108'"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - citybox-platform

volumes:
  citybox_typesense_data:
    name: citybox_typesense_data

networks:
  citybox-platform:
    name: citybox-platform
    external: true
