services:
  unleash-db:
    image: postgres:17-alpine
    container_name: citybox_unleash_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: ${UNLEASH_DB_PASSWORD:-unleash}
      POSTGRES_DB: unleash
    volumes:
      - citybox_unleash_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash -d unleash"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - citybox-platform

  unleash:
    image: unleashorg/unleash-server:6.9.0
    container_name: citybox_unleash
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://unleash:${UNLEASH_DB_PASSWORD:-unleash}@unleash-db:5432/unleash
      DATABASE_SSL: "false"
    ports:
      - "127.0.0.1:${UNLEASH_PORT:-4242}:4242"
    depends_on:
      unleash-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4242/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - citybox-platform

volumes:
  citybox_unleash_db_data:
    name: citybox_unleash_db_data

networks:
  citybox-platform:
    name: citybox-platform
    external: true
