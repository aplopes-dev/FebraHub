# Infraestrutura de produção aplopes.com — rede aplopes-platform.
# Database único: citybox (schemas por vertical via ?schema= na DATABASE_URL).
name: aplopes-infra

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: aplopes_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aplopes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aplopes}
      POSTGRES_DB: ${POSTGRES_DB:-citybox}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15433}:5432"
    volumes:
      - aplopes_postgres_data:/var/lib/postgresql/data
      - ../../infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-aplopes} -d ${POSTGRES_DB:-citybox}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aplopes-platform

  redis:
    image: redis:8-alpine
    container_name: aplopes_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - aplopes_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - aplopes-platform

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: aplopes_rabbitmq
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-citybox}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-citybox}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-citybox}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5673}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15673}:15672"
    volumes:
      - aplopes_rabbitmq_data:/var/lib/rabbitmq
      - ../../infra/rabbitmq/config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ../../infra/rabbitmq/config/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - aplopes-platform

  typesense:
    image: typesense/typesense:30.2
    container_name: aplopes_typesense
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-aplopes-dev-typesense-key}
      TYPESENSE_ENABLE_CORS: "true"
    ports:
      - "127.0.0.1:${TYPESENSE_PORT:-8108}:8108"
    volumes:
      - aplopes_typesense_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8108'"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - aplopes-platform

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: aplopes_minio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aplopes}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aplopes-minio-dev}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9002}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - aplopes_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aplopes-platform

  minio-init:
    image: minio/mc:latest
    container_name: aplopes_minio_init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/aplopes-food;
      mc mb --ignore-existing local/aplopes-platform-users;
      mc mb --ignore-existing local/aplopes-clinica;
      exit 0;
      "
    networks:
      - aplopes-platform

volumes:
  aplopes_postgres_data:
    name: aplopes_postgres_data
    external: true
  aplopes_redis_data:
    name: aplopes_redis_data
    external: true
  aplopes_rabbitmq_data:
    name: aplopes_rabbitmq_data
    external: true
  aplopes_typesense_data:
    name: aplopes_typesense_data
    external: true
  aplopes_minio_data:
    name: aplopes_minio_data
    external: true

networks:
  aplopes-platform:
    name: aplopes-platform
    external: true
