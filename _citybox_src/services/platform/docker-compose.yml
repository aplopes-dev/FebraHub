name: aplopes-platform

services:
  infra-wait:
    image: busybox:1.36.1
    container_name: aplopes_platform_infra_wait
    command:
      - sh
      - -c
      - |
        for i in $(seq 1 60); do
          nc -z aplopes_postgres 5432 && nc -z aplopes_redis 6379 && nc -z aplopes_rabbitmq 5672 && nc -z aplopes_typesense 8108 && exit 0
          sleep 2
        done
        echo "infra indisponível (postgres/redis/rabbitmq/typesense)" >&2
        exit 1
    restart: "no"
    networks:
      - aplopes-platform

  admin-api:
    build:
      context: ../..
      dockerfile: apps/admin/api/Dockerfile
      args:
        CACHEBUST: ${CACHEBUST:-unknown}
    image: aplopes-admin-api:latest
    container_name: aplopes_admin_api
    restart: unless-stopped
    env_file:
      - ../platform-apps.env
    environment:
      NODE_ENV: production
      AUTH_DEV_BYPASS: "false"
      PORT: 3103
      DATABASE_URL: ${PLATFORM_DATABASE_URL_DOCKER}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-https://auth.aplopes.com}
      KEYCLOAK_REALM: citybox-admin
      KEYCLOAK_ISSUER: ${KEYCLOAK_ADMIN_ISSUER:-https://auth.aplopes.com/realms/citybox-admin}
      KEYCLOAK_CLIENT_ID: admin-web
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_ADMIN_WEB_SECRET:?KEYCLOAK_ADMIN_WEB_SECRET nao configurado}
      KEYCLOAK_ALLOWED_AZP: admin-web
      KEYCLOAK_PROVISIONING_CLIENT_ID: admin-provisioning
      KEYCLOAK_PROVISIONING_CLIENT_SECRET: ${KEYCLOAK_ADMIN_PROVISIONING_SECRET:?KEYCLOAK_ADMIN_PROVISIONING_SECRET nao configurado}
      KEYCLOAK_ERP_M2M_ISSUER: ${KEYCLOAK_ERP_ISSUER:-https://auth.aplopes.com/realms/citybox-erp}
      KEYCLOAK_ERP_M2M_CLIENT_ID: admin-m2m
      KEYCLOAK_ERP_M2M_CLIENT_SECRET: ${KEYCLOAK_ERP_M2M_CLIENT_SECRET:?KEYCLOAK_ERP_M2M_CLIENT_SECRET nao configurado}
      KEYCLOAK_CLINICA_M2M_ISSUER: ${KEYCLOAK_CLINICA_ISSUER:-https://auth.aplopes.com/realms/citybox-clinica}
      KEYCLOAK_CLINICA_M2M_CLIENT_ID: admin-m2m
      KEYCLOAK_CLINICA_M2M_CLIENT_SECRET: ${KEYCLOAK_CLINICA_M2M_CLIENT_SECRET:?KEYCLOAK_CLINICA_M2M_CLIENT_SECRET nao configurado}
      KEYCLOAK_BEAUTIFUL_M2M_ISSUER: ${KEYCLOAK_BEAUTIFUL_ISSUER:-https://auth.aplopes.com/realms/citybox-beautiful}
      KEYCLOAK_BEAUTIFUL_M2M_CLIENT_ID: admin-m2m
      KEYCLOAK_BEAUTIFUL_M2M_CLIENT_SECRET: ${KEYCLOAK_BEAUTIFUL_M2M_CLIENT_SECRET:?KEYCLOAK_BEAUTIFUL_M2M_CLIENT_SECRET nao configurado}
      KEYCLOAK_IMOVEIS_M2M_ISSUER: ${KEYCLOAK_IMOVEIS_ISSUER:-https://auth.aplopes.com/realms/citybox-imoveis}
      KEYCLOAK_IMOVEIS_M2M_CLIENT_ID: admin-m2m
      KEYCLOAK_IMOVEIS_M2M_CLIENT_SECRET: ${KEYCLOAK_IMOVEIS_M2M_CLIENT_SECRET:?KEYCLOAK_IMOVEIS_M2M_CLIENT_SECRET nao configurado}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://citybox:citybox@aplopes_rabbitmq:5672/citybox}
      REDIS_URL: redis://aplopes_redis:6379
      MINIO_ENDPOINT: minio:9000
      SWAGGER_ENABLED: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://admin.aplopes.com,https://backoffice.aplopes.com}
      CLINICA_API_URL: ${CLINICA_API_URL:-http://clinica_api:3172}
      ERP_API_URL: ${ERP_API_URL:-http://erp-api:3114}
      IMOVEIS_API_URL: ${IMOVEIS_API_URL:-http://imoveis_api:3112}
      BEAUTIFUL_API_URL: ${BEAUTIFUL_API_URL:-http://beautiful_api:3173}
    ports:
      - "127.0.0.1:3103:3103"
    depends_on:
      infra-wait:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3103/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - aplopes-platform

  admin-web:
    build:
      context: ../..
      dockerfile: apps/admin/web/Dockerfile
      args:
        CACHEBUST: ${CACHEBUST:-unknown}
        NEXT_PUBLIC_KEYCLOAK_ISSUER: ${KEYCLOAK_ADMIN_ISSUER:-https://auth.aplopes.com/realms/citybox-admin}
        NEXT_PUBLIC_KEYCLOAK_CLIENT: admin-web
        NEXT_PUBLIC_ADMIN_ORIGIN: ${ADMIN_ORIGIN:-https://admin.aplopes.com}
    image: aplopes-admin-web:latest
    container_name: aplopes_admin_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3108
      ADMIN_API_URL: http://admin-api:3103/api
      NEXT_PUBLIC_KEYCLOAK_ISSUER: ${KEYCLOAK_ADMIN_ISSUER:-https://auth.aplopes.com/realms/citybox-admin}
      NEXT_PUBLIC_KEYCLOAK_CLIENT: admin-web
      NEXT_PUBLIC_ADMIN_ORIGIN: ${ADMIN_ORIGIN:-https://admin.aplopes.com}
      KEYCLOAK_INTERNAL_ISSUER: http://aplopes_keycloak:8080/realms/citybox-admin
      KEYCLOAK_ADMIN_WEB_SECRET: ${KEYCLOAK_ADMIN_WEB_SECRET:?KEYCLOAK_ADMIN_WEB_SECRET nao configurado}
    ports:
      - "127.0.0.1:3108:3108"
    depends_on:
      admin-api:
        condition: service_healthy
    networks:
      - aplopes-platform

  erp-api:
    build:
      context: ../..
      dockerfile: apps/erp/api/Dockerfile
      args:
        CACHEBUST: ${CACHEBUST:-unknown}
    image: aplopes-erp-api:latest
    container_name: aplopes_erp_api
    restart: unless-stopped
    env_file:
      - ../platform-apps.env
    environment:
      NODE_ENV: production
      AUTH_DEV_BYPASS: "false"
      PORT: 3114
      DATABASE_URL: ${ERP_DATABASE_URL_DOCKER}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-https://auth.aplopes.com}
      KEYCLOAK_REALM: citybox-erp
      KEYCLOAK_ISSUER: ${KEYCLOAK_ERP_ISSUER:-https://auth.aplopes.com/realms/citybox-erp}
      KEYCLOAK_CLIENT_ID: erp-web
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_ERP_WEB_SECRET:?KEYCLOAK_ERP_WEB_SECRET nao configurado}
      KEYCLOAK_ALLOWED_AZP: erp-web,admin-m2m
      KEYCLOAK_PROVISIONING_CLIENT_ID: erp-provisioning
      KEYCLOAK_PROVISIONING_CLIENT_SECRET: ${KEYCLOAK_ERP_PROVISIONING_SECRET:?KEYCLOAK_ERP_PROVISIONING_SECRET nao configurado}
      FISCAL_API_URL: http://fiscal-api:3116/api
      KEYCLOAK_FISCAL_M2M_CLIENT_ID: fiscal-m2m
      KEYCLOAK_FISCAL_M2M_CLIENT_SECRET: ${KEYCLOAK_FISCAL_M2M_CLIENT_SECRET:?KEYCLOAK_FISCAL_M2M_CLIENT_SECRET nao configurado}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://citybox:citybox@aplopes_rabbitmq:5672/citybox}
      MINIO_ENDPOINT: minio:9000
    ports:
      - "127.0.0.1:3114:3114"
    depends_on:
      infra-wait:
        condition: service_completed_successfully
      # Fiscal é auxiliar: falha de boot não deve derrubar o ERP (adapter trata 503).
      fiscal-api:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3114/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - aplopes-platform

  fiscal-api:
    build:
      context: ../..
      dockerfile: services/fiscal-api/Dockerfile
      args:
        CACHEBUST: ${CACHEBUST:-unknown}
    image: aplopes-fiscal-api:latest
    container_name: aplopes_fiscal_api
    restart: unless-stopped
    env_file:
      - ../platform-apps.env
    environment:
      NODE_ENV: production
      AUTH_DEV_BYPASS: "false"
      PORT: 3116
      DATABASE_URL: ${FISCAL_DATABASE_URL_DOCKER}
      KEYCLOAK_ALLOWED_ISSUERS: ${KEYCLOAK_ERP_ISSUER:-https://auth.aplopes.com/realms/citybox-erp}
      KEYCLOAK_ALLOWED_AZP: fiscal-m2m
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: fiscal
      # URL pública real de onde o Swagger é servido (nginx do host proxya
      # https://api.aplopes.com/fiscal/api/ → 127.0.0.1:3121, ver infra/AGENTS.md
      # §5.7) — sem isso o "Try it out" do Swagger UI chama a origem sem o
      # prefixo /fiscal/api e cai no vhost errado (era o 502 batendo no core-api).
      # ⚠️ SEM sufixo /api: o `setGlobalPrefix('api')` já entra nos paths do
      # próprio documento OpenAPI (ex.: "/api/v1/companies") — colocar /api
      # aqui também duplicava (.../fiscal/api/api/v1/companies, achado em
      # 2026-08-10). O nginx já reescreve /fiscal/api/... → .../api/... (ver
      # location /fiscal/api/ em api.aplopes.com.conf), então o server[] só
      # precisa do prefixo ATÉ ANTES do /api que o próprio doc já inclui.
      SWAGGER_PUBLIC_SERVER_URL: https://api.aplopes.com/fiscal
    ports:
      # host:container — a app escuta em 3116 dentro do container (PORT acima),
      # NÃO em 3121. Era "3121:3121" (bug: publicava uma porta em que nada
      # escutava internamente, connection reset em qualquer request ao host
      # 127.0.0.1:3121). 3116 fica de fora do publish de propósito: já é usado
      # por outro app nesta VPS compartilhada (ver infra/AGENTS.md §5.7).
      - "127.0.0.1:3121:3116"
    depends_on:
      infra-wait:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3116/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - aplopes-platform

  erp-web:
    build:
      context: ../..
      dockerfile: apps/erp/web/Dockerfile
      args:
        CACHEBUST: ${CACHEBUST:-unknown}
        NEXT_PUBLIC_KEYCLOAK_ISSUER: ${KEYCLOAK_ERP_ISSUER:-https://auth.aplopes.com/realms/citybox-erp}
        NEXT_PUBLIC_KEYCLOAK_CLIENT: erp-web
        NEXT_PUBLIC_BACKOFFICE_ORIGIN: ${BACKOFFICE_ORIGIN:-https://backoffice.aplopes.com}
    image: aplopes-erp-web:latest
    container_name: aplopes_erp_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3107
      ERP_API_URL: http://erp-api:3114/api
      NEXT_PUBLIC_KEYCLOAK_ISSUER: ${KEYCLOAK_ERP_ISSUER:-https://auth.aplopes.com/realms/citybox-erp}
      NEXT_PUBLIC_KEYCLOAK_CLIENT: erp-web
      KEYCLOAK_INTERNAL_ISSUER: http://aplopes_keycloak:8080/realms/citybox-erp
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_ERP_WEB_SECRET:?KEYCLOAK_ERP_WEB_SECRET nao configurado}
      # `/api/proxy/fiscal` (achado 2026-08-14): 6 telas fiscais (certificados,
      # séries, NFS-e, tipo de NF do PDV, regime do Emitente, configurações
      # gerais) ainda não migraram para o padrão erp-api-resolve-companyId
      # (só a aba "Emitido" do facilita-nfe migrou) — seguem chamando a
      # fiscal-api direto pelo proxy same-origin. Reusa o MESMO client que a
      # erp-api já usa (`fiscal-m2m`, único no allowlist da fiscal-api,
      # `KEYCLOAK_ALLOWED_AZP` abaixo) em vez de reviver `citybox-fiscal-service`
      # (client do extinto realm `citybox-dev`, ADR C-16 — dava "unauthorized").
      # `lib/api/fiscal-tenant-guard.ts` segue resolvendo o `companyId` pela
      # sessão do usuário antes de repassar; isso não reabre acesso cross-tenant.
      FISCAL_API_URL: http://fiscal-api:3116/api
      KEYCLOAK_FISCAL_M2M_CLIENT_ID: fiscal-m2m
      KEYCLOAK_FISCAL_M2M_CLIENT_SECRET: ${KEYCLOAK_FISCAL_M2M_CLIENT_SECRET:?KEYCLOAK_FISCAL_M2M_CLIENT_SECRET nao configurado}
    ports:
      - "127.0.0.1:3107:3107"
    depends_on:
      erp-api:
        condition: service_healthy
      fiscal-api:
        condition: service_healthy
    networks:
      - aplopes-platform

networks:
  aplopes-platform:
    name: aplopes-platform
    external: true
