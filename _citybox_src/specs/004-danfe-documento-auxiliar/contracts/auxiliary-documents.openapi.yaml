openapi: 3.1.0
info:
  title: Documento auxiliar da nota fiscal (DANFE / DANFSE)
  version: 1.0.0
  description: |
    Entrega o documento auxiliar imprimível de uma nota fiscal **já autorizada**.

    O PDF deriva integralmente do XML autorizado pelo órgão fiscal — nunca dos dados
    relacionais. Por isso uma reimpressão de meses depois representa a nota como ela foi
    autorizada, e não como o cadastro está hoje.

    Nada é persistido: o documento é gerado sob demanda a cada solicitação.

servers:
  - url: http://localhost:3116
    description: Local

tags:
  - name: nfe
    description: NF-e (mercadoria) — DANFE
  - name: nfse
    description: NFS-e (serviço) — DANFSE

paths:
  /api/v1/nfe/{id}/danfe:
    get:
      tags: [nfe]
      summary: Baixar o DANFE de uma NF-e autorizada
      description: |
        **Fase 1.** Documento auxiliar da NF-e, no leiaute do Manual de Orientação ao
        Contribuinte.

        Em ambiente de homologação o PDF sai com **marca d'água** cobrindo a página
        (`SEM VALOR FISCAL`). Nota cancelada é entregue **marcada como cancelada** — o
        histórico precisa ser reconstituível.
      operationId: getDanfe
      parameters:
        - $ref: '#/components/parameters/FiscalDocumentId'
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          $ref: '#/components/responses/PdfDocument'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/NotPrintable'
        '503':
          $ref: '#/components/responses/XmlUnavailable'

  /api/v1/nfse/{id}/danfse:
    get:
      tags: [nfse]
      summary: Baixar o DANFSE de uma NFS-e autorizada
      description: |
        **Fase 2.** Documento auxiliar da NFS-e, no leiaute do Padrão Nacional — distinto
        do DANFE.

        Quando a API oficial de DANFSE estiver disponível, ela é a fonte preferida; sua
        indisponibilidade não impede a entrega, porque há geração local. O cabeçalho
        `X-Document-Origin` informa qual caminho produziu o arquivo.

        Nota substituída é entregue indicando a substituição e identificando a substituta.
      operationId: getDanfse
      parameters:
        - $ref: '#/components/parameters/FiscalDocumentId'
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          $ref: '#/components/responses/PdfDocument'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/NotPrintable'
        '503':
          $ref: '#/components/responses/XmlUnavailable'

components:
  parameters:
    FiscalDocumentId:
      name: id
      in: path
      required: true
      description: Identificador do documento fiscal nesta API (UUID v7).
      schema:
        type: string
        format: uuid
      example: 33657f0e-0000-7000-8000-000000000000

    CompanyId:
      name: X-Company-Id
      in: header
      required: true
      description: |
        Emitente que faz a solicitação. Se não for o emitente da nota, a resposta é **404**
        — e não 403, porque 403 confirmaria que a nota existe, e a existência de documento
        fiscal de outro contribuinte já é informação.

        ⚠️ **Não é controle de acesso.** Este header é escolhido pelo chamador e o JWT não
        carrega claim de empresa: a comparação impede engano, não impede acesso deliberado
        a documento de outro contribuinte. Pendência de plataforma registrada em
        `research.md` § R7.
      schema:
        type: string
        format: uuid

  responses:
    PdfDocument:
      description: Documento auxiliar em PDF.
      headers:
        Content-Disposition:
          description: Nome sugerido, derivado da chave de acesso.
          schema:
            type: string
          example: inline; filename="DANFE-29136062250031609000104000000000002026080715989993.pdf"
        X-Document-Origin:
          description: |
            Qual caminho produziu o arquivo. Existe para que uma divergência visual entre
            documentos da mesma nota seja explicável.
          schema:
            type: string
            enum: [LOCAL, OFFICIAL_API]
        X-Fiscal-Validity:
          description: |
            `NONE` quando o documento foi gerado em homologação — o mesmo caso em que a
            marca d'água é aplicada. Permite ao consumidor tratar o arquivo sem depender de
            leitura visual.
          schema:
            type: string
            enum: [VALID, NONE]
      content:
        application/pdf:
          schema:
            type: string
            format: binary

    NotFound:
      description: |
        Documento inexistente, **ou** pertencente a outro emitente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error:
              code: FiscalDocumentNotFoundError
              message: Documento fiscal não encontrado

    NotPrintable:
      description: |
        A nota não está em estado que produza documento auxiliar. A resposta informa o
        **estado atual** — sem isso o operador não sabe se espera, consulta ou reemite.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            aindaProcessando:
              value:
                error:
                  code: DOCUMENT_NOT_PRINTABLE
                  message: A nota está em processamento no órgão fiscal. Consulte a nota em instantes.
            rejeitada:
              value:
                error:
                  code: DOCUMENT_NOT_PRINTABLE
                  message: A nota foi rejeitada pelo órgão fiscal e não possui documento auxiliar. Corrija os dados e emita novamente.

    XmlUnavailable:
      description: |
        O XML autorizado não pôde ser recuperado.

        A API **recusa** em vez de montar o documento a partir dos dados do banco: isso
        produziria um papel que diverge do que o fisco tem, sem que ninguém percebesse.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error:
              code: AUTHORIZED_XML_UNAVAILABLE
              message: O XML autorizado desta nota não está disponível no momento. Tente novamente; se persistir, acione o suporte.

  schemas:
    ApiError:
      type: object
      required: [error]
      description: |
        Envelope padrão de erro do fiscal-api, produzido por `AppExceptionFilter`.
        Não há campo de detalhe estruturado — o estado atual da nota vai no texto de
        `message`.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Código estável, para o sistema consumidor reagir.
            message:
              type: string
              description: Mensagem para a pessoa, em português.
