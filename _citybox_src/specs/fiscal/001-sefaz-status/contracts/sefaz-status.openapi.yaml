openapi: 3.1.0
info:
  title: Status de comunicação com o órgão fiscal (NF-e, NFC-e, NFS-e)
  version: 1.0.0
  description: |
    Consulta explícita "o órgão está atendendo?", separada de qualquer emissão.

    O valor da resposta está em distinguir **"o órgão respondeu que está fora"**
    (`DOWN`) de **"não obtivemos resposta"** (`UNREACHABLE`) — a segunda pode ser
    problema local (rede, certificado), e confundir as duas é o erro de
    diagnóstico que a feature evita.

    Regra inviolável (FR-003): ausência de resposta **nunca** vira `OPERATIONAL`.

    Só HOMOLOGATION. Produção é recusada por construção (424), como no resto do
    serviço. A consulta **não** consome numeração nem cria documento (FR-012).

servers:
  - url: http://localhost:3116
    description: Local

tags:
  - name: sefaz-status
    description: Disponibilidade dos órgãos fiscais

paths:
  /api/v1/sefaz-status:
    get:
      tags: [sefaz-status]
      summary: Consultar disponibilidade dos órgãos
      description: |
        Uma única consulta cobre por padrão os três modelos (NF-e, NFC-e, NFS-e).
        O filtro `models` restringe a quais perguntar — e o serviço **não** contata
        o órgão dos modelos não pedidos (FR-001a).

        Os órgãos são contatados em paralelo, com tempo limite por órgão: um órgão
        inalcançável não impede os demais de serem reportados nem derruba a
        consulta (FR-008a). A resposta inclui um veredito de topo (FR-001b) e o
        detalhe por modelo (FR-002), sempre com a idade do dado e quando haverá
        nova verificação (FR-005).

        **Sem verificação forçada** (FR-005a): se a última verificação está dentro
        do intervalo mínimo, a resposta vem do cache — exceder o limite pode
        bloquear o CNPJ.
      parameters:
        - name: X-Company-Id
          in: header
          required: true
          description: Empresa. Validada contra a participação do usuário na loja (FR-011); cross-tenant responde 404.
          schema: { type: string, format: uuid }
        - name: models
          in: query
          required: false
          description: Filtro opcional. Ausente = os três. Ex.- `NFCE` ou `NFE,NFCE`.
          schema:
            type: array
            items: { type: string, enum: [NFE, NFCE, NFSE] }
          style: form
          explode: false
        - name: environment
          in: query
          required: false
          description: Só HOMOLOGATION é aceito; PRODUCTION é recusado (424).
          schema: { type: string, enum: [HOMOLOGATION, PRODUCTION], default: HOMOLOGATION }
      responses:
        '200':
          description: Consulta concluída. Ver `overall` e `results[]`. Um modelo inalcançável ainda dá 200 (FR-008a) — a falha do órgão está em `results[].status`, não no HTTP.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SefazStatusResponse' }
              examples:
                nfceForaNfeNo:
                  summary: NFC-e inalcançável, NF-e atendendo, NFS-e não verificável
                  value:
                    overall: HAS_PROBLEM
                    checkedForCompanyId: 3acd9468-d7fd-4203-aab8-45635db1606e
                    environment: HOMOLOGATION
                    results:
                      - model: NFE
                        authority: SEFAZ-BA
                        status: OPERATIONAL
                        authorityMessage: Serviço em Operação
                        checkedAt: '2026-08-12T14:03:00-03:00'
                        ageSeconds: 12
                        nextCheckAt: '2026-08-12T14:06:00-03:00'
                      - model: NFCE
                        authority: SVRS
                        status: UNREACHABLE
                        authorityMessage: null
                        checkedAt: '2026-08-12T14:03:04-03:00'
                        ageSeconds: 8
                        nextCheckAt: '2026-08-12T14:06:04-03:00'
                      - model: NFSE
                        authority: SEFIN-NACIONAL
                        status: UNVERIFIABLE
                        authorityMessage: O Sistema Nacional não expõe operação de disponibilidade.
                        checkedAt: '2026-08-12T14:03:00-03:00'
                        ageSeconds: 12
                        nextCheckAt: null
        '400':
          description: Filtro `models` inválido.
        '401':
          description: Sem token válido.
        '404':
          description: Empresa inexistente ou de outro tenant (FR-011 — não revela existência).
        '422':
          description: Certificado ausente ou vencido — falha **local** (FR-010). `status` do modelo afetado seria `LOCAL_ERROR`; quando afeta toda a consulta, 422.
        '424':
          description: PRODUCTION solicitado sem configuração — recusado antes de qualquer contato (FR-009).

components:
  schemas:
    ServiceStatus:
      type: string
      description: |
        Situação apurada por modelo (FR-002). `OPERATIONAL`/`DOWN` = o órgão
        respondeu; `UNREACHABLE` = sem resposta; `UNVERIFIABLE` = órgão não oferece
        a consulta; `LOCAL_ERROR` = falha nossa (certificado). Nunca `OPERATIONAL`
        sem resposta do órgão (FR-003).
      enum: [OPERATIONAL, DOWN, UNREACHABLE, UNVERIFIABLE, LOCAL_ERROR]

    OverallVerdict:
      type: string
      description: Resumo do conjunto (FR-001b). Não substitui o detalhe por modelo.
      enum: [ALL_OPERATIONAL, HAS_PROBLEM, INCONCLUSIVE]

    ModelStatus:
      type: object
      required: [model, authority, status, checkedAt, ageSeconds]
      properties:
        model: { type: string, enum: [NFE, NFCE, NFSE] }
        authority:
          type: string
          description: Qual órgão foi consultado (FR-004). Varia por modelo mesmo no mesmo estado.
        status: { $ref: '#/components/schemas/ServiceStatus' }
        authorityMessage:
          type: [string, 'null']
          description: Mensagem original do órgão, literal (FR-006).
        expectedReturnAt:
          type: [string, 'null']
          format: date-time
          description: Previsão de retorno quando o órgão a informa (FR-006).
        checkedAt:
          type: string
          format: date-time
          description: Instante da apuração (FR-005).
        ageSeconds:
          type: integer
          description: Idade do dado em segundos (FR-005). 0 = recém-verificado.
        nextCheckAt:
          type: [string, 'null']
          format: date-time
          description: Quando haverá nova verificação (FR-005). null para UNVERIFIABLE.

    SefazStatusResponse:
      type: object
      required: [overall, checkedForCompanyId, environment, results]
      properties:
        overall: { $ref: '#/components/schemas/OverallVerdict' }
        checkedForCompanyId: { type: string, format: uuid }
        environment: { type: string, enum: [HOMOLOGATION, PRODUCTION] }
        results:
          type: array
          items: { $ref: '#/components/schemas/ModelStatus' }

  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearer: []
