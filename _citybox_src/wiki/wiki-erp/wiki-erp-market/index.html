<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiki ERP Market — Citybox</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>
    window.WIKI = {
      sections: [],
      register: function(section) { this.sections.push(section); }
    };
  </script>
</head>
<body>

<!-- Topbar -->
<header class="topbar">
  <div class="topbar-brand">
    <button id="menuToggle" style="display:none;background:none;border:none;color:white;font-size:22px;padding:4px 8px;">☰</button>
    <div class="brand-logo">🛒</div>
    <div class="brand-text">
      <span class="brand-name">ERP Market</span>
      <span class="brand-sub">Citybox · Blueprint</span>
    </div>
  </div>

  <button class="search-trigger" id="searchTrigger">
    🔍 <span>Buscar seção…</span>
    <kbd>Ctrl K</kbd>
  </button>

  <nav class="topbar-wikis" aria-label="Wikis do ecossistema">
    <a class="topbar-wiki-link" href="/wiki-admin/">🛠️ <span>Admin</span></a>
    <a class="topbar-wiki-link" href="/wiki-erp/wiki-erp/">🏪 <span>ERP Base</span></a>
    <a class="topbar-wiki-link" href="/wiki-erp/wiki-erp-food/">🍔 <span>Food</span></a>
    <a class="topbar-wiki-link active" href="/wiki-erp/wiki-erp-market/">🛒 <span>Market</span></a>
    <a class="topbar-wiki-link" href="/wiki-erp/wiki-erp-clinic/">🏥 <span>Clinic</span></a>
    <a class="topbar-wiki-link" href="/wiki-services/">⚙️ <span>Services</span></a>
    <a class="topbar-wiki-link" href="/wiki-marketplace/">🛍️ <span>Marketplace</span></a>
    <a class="topbar-wiki-link" href="/wiki-arquitetura/">🏛️ <span>Arquitetura</span></a>
  </nav>

  <div class="topbar-progress">
    <span class="progress-text" id="progressText">0 de 19 seções aprovadas</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
</header>

<!-- Search overlay -->
<div class="search-overlay" id="searchOverlay">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchInput" placeholder="Buscar em todas as seções…" autocomplete="off">
    <span class="search-esc">Esc</span>
  </div>
  <div class="search-results" id="searchResults"></div>
  <div class="search-backdrop" id="searchBackdrop"></div>
</div>

<!-- Layout -->
<div class="layout">
  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-inner">
      <div class="sidebar-nav" id="sidebarNav"></div>
    </div>
  </nav>

  <!-- Main -->
  <main class="main" id="mainContent">
    <div class="section-content" id="section-content">
      <div class="loading-placeholder">
        <div class="loading-spinner"></div>
        <span>Carregando…</span>
      </div>
    </div>
  </main>
</div>

<!-- Mermaid -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

<!-- Content sections -->
<script src="assets/js/content/00-visao-geral-market.js"></script>
<script src="assets/js/content/01-benchmark-market.js"></script>
<script src="assets/js/content/02-jornada-varejo.js"></script>
<script src="assets/js/content/03-catalogo-produtos.js"></script>
<script src="assets/js/content/04-balanca-granel.js"></script>
<script src="assets/js/content/05-pdv-frente-caixa.js"></script>
<script src="assets/js/content/06-estoque-validade-lotes.js"></script>
<script src="assets/js/content/07-recebimento-mercadorias.js"></script>
<script src="assets/js/content/08-precificacao-promocoes.js"></script>
<script src="assets/js/content/09-pedidos-canais-market.js"></script>
<script src="assets/js/content/10-fiscal-market.js"></script>
<script src="assets/js/content/11-compras-fornecedores.js"></script>
<script src="assets/js/content/12-financeiro-varejo.js"></script>
<script src="assets/js/content/13-crm-fidelidade-market.js"></script>
<script src="assets/js/content/14-marketplace-market.js"></script>
<script src="assets/js/content/15-rbac-equipe-market.js"></script>
<script src="assets/js/content/16-configuracoes-market.js"></script>
<script src="assets/js/content/17-relatorios-market.js"></script>
<script src="assets/js/content/18-roadmap-market.js"></script>
<script src="assets/js/content/19-como-aprovar-market.js"></script>

<!-- App core (must be last) -->
<script src="assets/js/app.js"></script>
</body>
</html>
