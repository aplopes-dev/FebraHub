document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ção dos produtos para salvá-los aqui.<\u002Fdiv>\n            <button onclick=\"{{ goHomeTab }}\" style=\"margin-top:8px;border:none;background:#111111;color:#fff;font-family:inherit;font-size:14px;font-weight:700;border-radius:8px;padding:11px 22px;cursor:pointer\">Explorar produtos<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ favList }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px\">\n          <sc-for list=\"{{ favList }}\" as=\"p\" hint-placeholder-count=\"0\">\n            <div onclick=\"{{ p.onOpen }}\" style=\"background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:10px;overflow:hidden;position:relative;display:flex;flex-direction:column;cursor:pointer\">\n              <button onclick=\"{{ p.onFav }}\" aria-label=\"Remover\" style=\"position:absolute;top:8px;right:8px;width:32px;height:32px;border:none;background:rgba(255,255,255,.92);border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.15);z-index:2\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"{{ p.heartFill }}\" stroke=\"{{ p.heartStroke }}\" stroke-width=\"2\"><path d=\"M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n              <div style=\"height:138px;background:{{ p.bg }};display:flex;align-items:center;justify-content:center;padding:8px\"><div style=\"width:100%;height:100%;background-image:url('{{ p.img }}');background-size:contain;background-repeat:no-repeat;background-position:center\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"padding:9px 11px 13px;display:flex;flex-direction:column;gap:2px\">\n                <div style=\"display:flex;align-items:baseline;gap:6px\"><span style=\"font-size:20px;font-weight:600;color:rgba(0,0,0,.9);white-space:nowrap\">R$ {{ p.priceInt }}<\u002Fspan><span style=\"font-size:12px;font-weight:600;color:#00A650\">{{ p.discountFmt }}<\u002Fspan><\u002Fdiv>\n                <span style=\"font-size:11px;color:#00A650;font-weight:700\">{{ p.installments }}<\u002Fspan>\n                <span style=\"font-size:12px;color:rgba(0,0,0,.8);line-height:1.3;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden\">{{ p.title }}<\u002Fspan>\n                <span style=\"font-size:11px;color:#00A650;font-weight:700;margin-top:3px\">Frete grátis<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n\n    <!-- bottom buy bar (PDP) -->\n    <sc-if value=\"{{ showBuyBar }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex-shrink:0;display:flex;gap:10px;padding:10px 16px 12px;background:#fff;border-top:1px solid rgba(0,0,0,.1);box-shadow:0 -2px 10px rgba(0,0,0,.05)\">\n      <button onclick=\"{{ addCurrentToCart }}\" style=\"flex:1;height:46px;border:1px solid #111111;border-radius:8px;background:rgba(52,131,250,.08);color:#111111;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer\">Adicionar<\u002Fbutton>\n      <button onclick=\"{{ buyNow }}\" style=\"flex:1.3;height:46px;border:none;border-radius:8px;background:#111111;color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer\">Comprar agora<\u002Fbutton>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- bottom tab bar -->\n    <sc-if value=\"{{ showTabBar }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"flex-shrink:0;display:flex;background:#fff;border-top:1px solid rgba(0,0,0,.1);padding:6px 4px 8px\">\n      <div onclick=\"{{ goHomeTab }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer\">\n        <svg width=\"23\" height=\"23\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{ tabHomeColor }}\" stroke-width=\"2\"><path d=\"M3 10.5L12 3l9 7.5\"><\u002Fpath><path d=\"M5 9.5V20h14V9.5\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font-size:10px;color:{{ tabHomeColor }};font-weight:600\">Início<\u002Fspan>\n      <\u002Fdiv>\n      <div onclick=\"{{ goFavTab }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer\">\n        <svg width=\"23\" height=\"23\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{ tabFavColor }}\" stroke-width=\"2\"><path d=\"M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font-size:10px;color:{{ tabFavColor }};font-weight:600\">Favoritos<\u002Fspan>\n      <\u002Fdiv>\n      <div onclick=\"{{ goCartTab }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative\">\n        <svg width=\"23\" height=\"23\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{ tabCartColor }}\" stroke-width=\"2\"><circle cx=\"9\" cy=\"20\" r=\"1.4\"><\u002Fcircle><circle cx=\"18\" cy=\"20\" r=\"1.4\"><\u002Fcircle><path d=\"M2.5 3h2.2l2.2 11.2a1.6 1.6 0 0 0 1.6 1.3h8.4a1.6 1.6 0 0 0 1.6-1.2L21.5 7H6\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font-size:10px;color:{{ tabCartColor }};font-weight:600\">Carrinho<\u002Fspan>\n        <span style=\"position:absolute;top:-3px;right:24px;min-width:15px;height:15px;background:#111111;color:#fff;border-radius:999px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px\">{{ cartCount }}<\u002Fspan>\n      <\u002Fdiv>\n      <div onclick=\"{{ goOrdersTab }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer\">\n        <svg width=\"23\" height=\"23\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{ tabOrdersColor }}\" stroke-width=\"2\"><path d=\"M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z\"><\u002Fpath><path d=\"M3.3 7L12 12l8.7-5M12 22V12\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font-size:10px;color:{{ tabOrdersColor }};font-weight:600\">Compras<\u002Fspan>\n      <\u002Fdiv>\n      <div onclick=\"{{ goAccountTab }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer\">\n        <svg width=\"23\" height=\"23\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{ tabAccountColor }}\" stroke-width=\"2\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\u002Fcircle><path d=\"M4 21c0-4 4-6 8-6s8 2 8 6\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font-size:10px;color:{{ tabAccountColor }};font-weight:600\">Conta<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:920},&quot;accentTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Preto (marca)&quot;,&quot;Clean (branco)&quot;],&quot;default&quot;:&quot;Preto (marca)&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Visual&quot;},&quot;homeLayout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Grade 2 colunas&quot;,&quot;Lista editorial&quot;],&quot;default&quot;:&quot;Grade 2 colunas&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;pdpBuyBar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Interação&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    stack: ['login'],\n    tab: 'home',\n    cart: { p1: 1, p2: 1 },\n    favs: { p3: true, p6: true },\n    query: 'smartphone',\n    pid: 'p1',\n    fFree: false,\n    fFull: false,\n    pay: 'pix',\n    order: { no: '2000482', items: { p1: 1 }, totalFmt: 'R$ 1.799,90' },\n  };\n\n  phImg(label, bg) {\n    const svg = '<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"400\" height=\"400\"><rect width=\"400\" height=\"400\" fill=\"' + (bg || '#f5f5f5') + '\"/><text x=\"200\" y=\"214\" font-family=\"Mulish,Arial\" font-size=\"27\" font-weight=\"700\" fill=\"rgba(0,0,0,.38)\" text-anchor=\"middle\">' + label + '<\u002Ftext><\u002Fsvg>';\n    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);\n  }\n\n  products = [\n    { id:'p1', title:'Smartphone Galaxy A55 5G 256GB 8GB RAM Câmera Tripla 50MP', amount:1799.9, original:2199, discount:18, installments:'em 10x R$ 179,99 sem juros', rating:4.7, reviews:845, freeShipping:true, full:true, bg:'#eef3fb', img:this.phImg('Smartphone','#eef3fb') },\n    { id:'p2', title:'Fone de Ouvido Bluetooth In-ear com Cancelamento de Ruído', amount:199.9, original:349, discount:43, installments:'em 6x R$ 33,31 sem juros', rating:4.5, reviews:2310, freeShipping:true, full:true, bg:'#f2f7ee', img:this.phImg('Fone BT','#f2f7ee') },\n    { id:'p3', title:'Smart TV 50\" 4K UHD LED com HDR e Wi-Fi Integrado', amount:2099, original:2799, discount:25, installments:'em 12x R$ 174,92 sem juros', rating:4.8, reviews:530, freeShipping:true, full:false, bg:'#f6eef3', img:this.phImg('Smart TV','#f6eef3') },\n    { id:'p4', title:'Cadeira Gamer Ergonômica Reclinável com Apoio Lombar', amount:899.9, original:1299, discount:30, installments:'em 10x R$ 89,99 sem juros', rating:4.4, reviews:1180, freeShipping:true, full:true, bg:'#fbf3ea', img:this.phImg('Cadeira','#fbf3ea') },\n    { id:'p5', title:'Notebook Ultra 15.6\" Core i5 16GB SSD 512GB Windows 11', amount:3299, original:3999, discount:17, installments:'em 12x R$ 274,92 sem juros', rating:4.6, reviews:312, freeShipping:true, full:true, bg:'#eef3fb', img:this.phImg('Notebook','#eef3fb') },\n    { id:'p6', title:'Tênis Esportivo Corrida Masculino Leve Amortecimento', amount:249.9, original:399, discount:37, installments:'em 8x R$ 31,24 sem juros', rating:4.3, reviews:4205, freeShipping:true, full:false, bg:'#f2f7ee', img:this.phImg('Tênis','#f2f7ee') },\n    { id:'p7', title:'Air Fryer Fritadeira sem Óleo 5L Digital Antiaderente', amount:379.9, original:549, discount:31, installments:'em 10x R$ 37,99 sem juros', rating:4.7, reviews:6840, freeShipping:true, full:true, bg:'#fbf3ea', img:this.phImg('Air Fryer','#fbf3ea') },\n    { id:'p8', title:'Relógio Smartwatch Tela AMOLED GPS à Prova d\\u2019água', amount:459.9, original:699, discount:34, installments:'em 10x R$ 45,99 sem juros', rating:4.5, reviews:1925, freeShipping:true, full:true, bg:'#f6eef3', img:this.phImg('Smartwatch','#f6eef3') },\n  ];\n\n  shortcutDefs = [\n    { label:'Ofertas', icon:'🏷️', bg:'#fde8e8' },\n    { label:'Supermercado', icon:'🛒', bg:'#e6f4ea' },\n    { label:'Moda', icon:'👕', bg:'#ede9fb' },\n    { label:'Tecnologia', icon:'📱', bg:'#e7f0fe' },\n    { label:'Casa', icon:'🛋️', bg:'#fbf1e3' },\n    { label:'Beleza', icon:'💄', bg:'#fde8f3' },\n    { label:'Esportes', icon:'⚽', bg:'#e6f4ea' },\n    { label:'Cupons', icon:'🎟️', bg:'#fff4d6' },\n  ];\n\n  brlFull(n){ return n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }\n  intFmt(n){ return Math.round(n).toLocaleString('pt-BR'); }\n\n  decorate(p){\n    const parts = this.brlFull(p.amount).split(',');\n    const fav = !!this.state.favs[p.id];\n    const r = Math.round(p.rating);\n    return Object.assign({}, p, {\n      priceInt: parts[0], priceCents: parts[1],\n      originalFmt: 'R$ ' + this.intFmt(p.original),\n      discountFmt: p.discount + '% OFF',\n      reviewsFmt: '(' + p.reviews.toLocaleString('pt-BR') + ')',\n      ratingFmt: p.rating.toFixed(1),\n      starsFull: '★'.repeat(r), starsEmpty: '☆'.repeat(5 - r),\n      isFav: fav,\n      heartFill: fav ? '#111111' : 'rgba(0,0,0,0)',\n      heartStroke: fav ? '#111111' : 'rgba(0,0,0,.55)',\n      onOpen: () => this.open(p.id),\n      onFav: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.toggleFav(p.id); },\n    });\n  }\n\n  buildLines(map){\n    return Object.keys(map).map(id => {\n      const p = this.products.find(x => x.id === id);\n      const qty = map[id];\n      const d = this.decorate(p);\n      return Object.assign({}, d, {\n        qty,\n        lineTotalFmt: 'R$ ' + this.brlFull(p.amount * qty),\n        onInc: () => this.changeQty(id, 1),\n        onDec: () => this.changeQty(id, -1),\n        onRemove: () => this.removeLine(id),\n      });\n    });\n  }\n  computeTotal(map){ return Object.keys(map).reduce((s,id)=> s + this.products.find(x=>x.id===id).amount * map[id], 0); }\n\n  scrollTop(){ setTimeout(()=>{ const el=document.querySelector('[data-screen-scroll]'); if(el) el.scrollTop=0; },0); }\n  go(screen){ this.setState(s=>({ stack:[...s.stack, screen] })); this.scrollTop(); }\n  back(){ this.setState(s=> s.stack.length>1 ? { stack:s.stack.slice(0,-1) } : s); this.scrollTop(); }\n  setTab(tab){ this.setState({ tab, stack:[tab] }); this.scrollTop(); }\n  open(id){ this.setState(s=>({ stack:[...s.stack,'pdp'], pid:id })); this.scrollTop(); }\n\n  toggleFav(id){ this.setState(s=>{ const f=Object.assign({},s.favs); if(f[id]) delete f[id]; else f[id]=true; return { favs:f }; }); }\n  addToCart(id){ this.setState(s=>({ cart:Object.assign({},s.cart,{ [id]:(s.cart[id]||0)+1 }) })); }\n  changeQty(id,d){ this.setState(s=>{ const c=Object.assign({},s.cart); c[id]=Math.max(1,(c[id]||1)+d); return { cart:c }; }); }\n  removeLine(id){ this.setState(s=>{ const c=Object.assign({},s.cart); delete c[id]; return { cart:c }; }); }\n\n  placeOrder(){\n    const base = this.computeTotal(this.state.cart);\n    const total = base - (this.state.pay==='pix' ? base*0.05 : 0);\n    const no = '200' + Math.floor(1000 + Math.random()*9000);\n    this.setState(s=>({ order:{ no, items:Object.assign({},s.cart), totalFmt:'R$ '+this.brlFull(total) }, cart:{}, stack:[...s.stack,'confirm'] }));\n    this.scrollTop();\n  }\n\n  renderVals(){\n    const s = this.state;\n    const screen = s.stack[s.stack.length-1];\n    const light = (this.props.accentTheme ?? 'Preto (marca)') === 'Clean (branco)';\n    const homeList = (this.props.homeLayout ?? 'Grade 2 colunas') === 'Lista editorial';\n    const buyBarOn = this.props.pdpBuyBar ?? true;\n\n    const headerBg = light ? '#ffffff' : '#111111';\n    const headerFg = light ? 'rgba(0,0,0,.9)' : '#ffffff';\n    const whiteTop = screen==='pdp' || screen==='checkout' || screen==='confirm';\n    const statusBg = whiteTop ? '#ffffff' : headerBg;\n    const statusFg = whiteTop ? '#000000' : (light ? '#000000' : '#ffffff');\n\n    const cart = s.cart;\n    const cartCount = Object.values(cart).reduce((a,b)=>a+b,0);\n    const cartLines = this.buildLines(cart);\n    const cartTotal = this.computeTotal(cart);\n\n    // checkout\n    const coBase = cartTotal;\n    const coPixV = s.pay==='pix' ? coBase*0.05 : 0;\n    const coTotal = coBase - coPixV;\n\n    // search\n    let sl = this.products;\n    if (s.fFull) sl = sl.filter(p=>p.full);\n    if (s.fFree) sl = sl.filter(p=>p.freeShipping);\n\n    const favList = this.products.filter(p=>s.favs[p.id]).map(p=>this.decorate(p));\n    const cp = this.decorate(this.products.find(p=>p.id===s.pid) || this.products[0]);\n    const cpThumbs = [0,1,2,3].map(i=>({ img:cp.img, borderColor: i===0 ? '#111111' : 'rgba(0,0,0,.12)' }));\n\n    const tabC = (t)=> s.tab===t ? '#111111' : 'rgba(0,0,0,.4)';\n\n    const trackSteps = [\n      { label:'Pedido confirmado', sub:'Seg, 28 jun', state:'done' },\n      { label:'Pagamento aprovado', sub:'Seg, 28 jun', state:'done' },\n      { label:'Em preparação', sub:'Saindo do centro de distribuição FULL', state:'current' },\n      { label:'A caminho', sub:'Previsto para qua, 30 jun', state:'todo' },\n      { label:'Entregue', sub:'Qui, 1 jul', state:'todo' },\n    ].map((st,i,arr)=>({\n      ...st,\n      isLast: i===arr.length-1,\n      dotBg: st.state==='done' ? '#00A650' : st.state==='current' ? '#111111' : '#ffffff',\n      dotBorder: st.state==='todo' ? '2px solid rgba(0,0,0,.2)' : '2px solid transparent',\n      lineColor: st.state==='done' ? '#00A650' : 'rgba(0,0,0,.15)',\n      titleColor: st.state==='todo' ? 'rgba(0,0,0,.45)' : 'rgba(0,0,0,.9)',\n      done: st.state==='done', current: st.state==='current',\n    }));\n\n    return {\n      headerBg, headerFg, statusBg, statusFg,\n      isLogin: screen==='login', isHome: screen==='home', isSearch: screen==='search',\n      isPdp: screen==='pdp', isCart: screen==='cart', isCheckout: screen==='checkout',\n      isConfirm: screen==='confirm', isTracking: screen==='orders', isAccount: screen==='account', isFavorites: screen==='favorites',\n      showTabBar: ['home','search','favorites','cart','orders','account'].includes(screen),\n      showBuyBar: screen==='pdp' && buyBarOn,\n\n      goBack: ()=>this.back(),\n      goHomeTab: ()=>this.setTab('home'), goFavTab: ()=>this.setTab('favorites'),\n      goCartTab: ()=>this.setTab('cart'), goOrdersTab: ()=>this.setTab('orders'), goAccountTab: ()=>this.setTab('account'),\n      tabHomeColor: tabC('home'), tabFavColor: tabC('favorites'), tabCartColor: tabC('cart'),\n      tabOrdersColor: tabC('orders'), tabAccountColor: tabC('account'),\n      cartCount,\n\n      doLogin: ()=>this.setState({ stack:['home'], tab:'home' }),\n\n      shortcuts: this.shortcutDefs.map(d=>({ ...d, onClick: ()=>this.go('search') })),\n      offers: this.products.map(p=>this.decorate(p)),\n      homeGrid: !homeList, homeList,\n      doSearch: ()=>this.go('search'),\n      doSearchOffers: ()=>this.setState(st=>({ query:'ofertas', stack:[...st.stack,'search'] })),\n\n      query: s.query,\n      onQueryInput: (e)=>this.setState({ query:e.target.value }),\n      searchList: sl.map(p=>this.decorate(p)),\n      searchCount: sl.length + ' resultados',\n      fFree: s.fFree, fFull: s.fFull,\n      toggleFree: ()=>this.setState(st=>({ fFree:!st.fFree })),\n      toggleFull: ()=>this.setState(st=>({ fFull:!st.fFull })),\n      freeChipBg: s.fFree ? '#111111' : '#ffffff', freeChipFg: s.fFree ? '#ffffff' : 'rgba(0,0,0,.75)', freeChipBd: s.fFree ? '#111111' : 'rgba(0,0,0,.2)',\n      fullChipBg: s.fFull ? '#111111' : '#ffffff', fullChipFg: s.fFull ? '#ffffff' : 'rgba(0,0,0,.75)', fullChipBd: s.fFull ? '#111111' : 'rgba(0,0,0,.2)',\n\n      cp, cpThumbs,\n      buyNow: ()=>{ this.addToCart(s.pid); this.go('checkout'); },\n      addCurrentToCart: ()=>{ this.addToCart(s.pid); this.setTab('cart'); },\n\n      cartLines, cartEmpty: cartLines.length===0,\n      cartSubtotalFmt: 'R$ '+this.brlFull(cartTotal),\n      cartCountItems: cartCount,\n      goCheckout: ()=>this.go('checkout'),\n\n      addrName: 'Camila Souza', addrLine: 'Rua das Palmeiras, 245 — São Paulo, SP',\n      payPix: s.pay==='pix', payCard: s.pay==='card', payBoleto: s.pay==='boleto',\n      setPix: ()=>this.setState({ pay:'pix' }), setCard: ()=>this.setState({ pay:'card' }), setBoleto: ()=>this.setState({ pay:'boleto' }),\n      coProdFmt: 'R$ '+this.brlFull(coBase), coPix: s.pay==='pix', coPixFmt: '- R$ '+this.brlFull(coPixV), coTotalFmt: 'R$ '+this.brlFull(coTotal),\n      placeOrder: ()=>this.placeOrder(),\n\n      orderNo: s.order.no, confirmTotalFmt: s.order.totalFmt,\n      goTracking: ()=>this.setTab('orders'), goHomeFromConfirm: ()=>this.setTab('home'),\n      arrivalText: 'Chega quinta-feira, 1 de julho',\n      orderLines: this.buildLines(s.order.items), orderNoT: s.order.no, orderTotalT: s.order.totalFmt,\n      trackSteps,\n\n      userName: 'Camila Souza',\n      goAddresses: ()=>this.go('account'),\n      favList, favEmpty: favList.length===0,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
