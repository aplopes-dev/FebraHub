<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiki Services — Citybox</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>
    window.WIKI = {
      sections: [],
      register: function(section) { this.sections.push(section); }
    };
  </script>
</head>
<body>

  <header class="topbar" role="banner">
    <div class="topbar-brand">
      <div class="brand-logo">S</div>
      <div class="brand-text">
        <span class="brand-name">Wiki Services</span>
        <span class="brand-sub">Citybox · Blueprint</span>
      </div>
    </div>

    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu" style="display:none; background:none; border:none; color:white; font-size:22px; padding:4px 8px; flex-shrink:0;">☰</button>
    <button class="search-trigger" id="searchTrigger" aria-label="Pesquisar seções">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Pesquisar seções…</span>
      <kbd>Ctrl+K</kbd>
    </button>

    <nav class="topbar-wikis" aria-label="Wikis do ecossistema">
      <a class="topbar-wiki-link" href="/wiki-admin/">🛠️ <span>Admin</span></a>
      <a class="topbar-wiki-link" href="/wiki-erp/wiki-erp/">🏪 <span>ERP Base</span></a>
      <a class="topbar-wiki-link" href="/wiki-erp/wiki-erp-food/">🍔 <span>Food</span></a>
      <a class="topbar-wiki-link" href="/wiki-erp/wiki-erp-market/">🛒 <span>Market</span></a>
      <a class="topbar-wiki-link" href="/wiki-erp/wiki-erp-clinic/">🏥 <span>Clinic</span></a>
      <a class="topbar-wiki-link active" href="/wiki-services/">⚙️ <span>Services</span></a>
      <a class="topbar-wiki-link" href="/wiki-marketplace/">🛍️ <span>Marketplace</span></a>
      <a class="topbar-wiki-link" href="/wiki-arquitetura/">🏛️ <span>Arquitetura</span></a>
    </nav>

    <div class="topbar-progress">
      <span id="progressText" class="progress-text">0 de 2 seções aprovadas</span>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
      </div>
    </div>
  </header>

  <div class="search-overlay" id="searchOverlay" role="dialog" aria-modal="true">
    <div class="search-box">
      <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar no wiki…" autocomplete="off" spellcheck="false">
      <kbd class="search-esc">Esc</kbd>
    </div>
    <div class="search-results" id="searchResults"></div>
    <div class="search-backdrop" id="searchBackdrop"></div>
  </div>

  <div class="layout">
    <aside class="sidebar" role="navigation">
      <div class="sidebar-inner">
        <nav id="sidebarNav" class="sidebar-nav"></nav>
      </div>
    </aside>
    <main class="main" role="main" id="mainContent">
      <div id="section-content" class="section-content">
        <div class="loading-placeholder">
          <div class="loading-spinner"></div>
          <p>Carregando wiki…</p>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <!-- Introdução -->
  <script src="assets/js/content/00-visao-geral.js"></script>
  <!-- Serviços -->
  <script src="assets/js/content/01-payment-api.js"></script>
  <!-- Aprovação -->
  <script src="assets/js/content/02-como-aprovar.js"></script>

  <script src="assets/js/app.js"></script>
</body>
</html>
