# FebraHub — produção (VPS 72.61.131.155, /opt/febrahub)
#
# Nada de banco ou storage publicado no host: Postgres e MinIO só existem na
# rede do compose. Web e API escutam em 127.0.0.1, e quem fala com a internet é
# o Nginx do host, que termina o TLS.

name: febrahub

x-log: &log
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    image: postgres:17.4-alpine
    container_name: febrahub_postgres
    restart: unless-stopped
    logging: *log
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # A base nasce com encoding e collation definidos: nome de aluno tem
      # acento, e ordenação errada estraga ranking e busca.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
      TZ: America/Bahia
      PGTZ: America/Bahia
    volumes:
      - postgres_dados:/var/lib/postgresql/data
    networks: [interna]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 2G }

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: febrahub_minio
    restart: unless-stopped
    logging: *log
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      TZ: America/Bahia
    volumes:
      - minio_dados:/data
    networks: [interna]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 1G }

  # Cria o bucket e fecha o acesso anônimo. Sobe, faz o serviço e sai.
  minio_init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    container_name: febrahub_minio_init
    depends_on:
      minio: { condition: service_healthy }
    networks: [interna]
    entrypoint: >
      /bin/sh -c "
      mc alias set fh http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
      (mc ls fh/$$MINIO_BUCKET >/dev/null 2>&1 || mc mb fh/$$MINIO_BUCKET) &&
      mc anonymous set none fh/$$MINIO_BUCKET &&
      mc version enable fh/$$MINIO_BUCKET || true &&
      echo 'bucket pronto'"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: febrahub-api:${TAG:-latest}
    container_name: febrahub_api
    restart: unless-stopped
    logging: *log
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3261
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      COOKIE_SECRET: ${COOKIE_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      MINIO_ENDPOINT: minio
      MINIO_PORT: '9000'
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}
      CORS_ORIGIN: ${CORS_ORIGIN}
      APP_URL: ${APP_URL}
      ETL_TOKEN: ${ETL_TOKEN}
      APP_VERSION: ${TAG:-1.0.0}
      TZ: America/Bahia
    ports:
      - '127.0.0.1:3261:3261'
    networks: [interna]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3261/api/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 1G }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    image: febrahub-web:${TAG:-latest}
    container_name: febrahub_web
    restart: unless-stopped
    logging: *log
    depends_on:
      api: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3260
      HOSTNAME: 0.0.0.0
      # No servidor o Next fala com a API pela rede do compose; no browser, pelo
      # caminho /api do próprio domínio (ver NEXT_PUBLIC_API_URL).
      API_INTERNAL_URL: http://api:3261
      TZ: America/Bahia
    ports:
      - '127.0.0.1:3260:3260'
    networks: [interna]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3260/api/saude',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 40s
    deploy:
      resources:
        limits: { memory: 1G }

volumes:
  postgres_dados:
    name: febrahub_postgres_dados
  minio_dados:
    name: febrahub_minio_dados

networks:
  interna:
    name: febrahub_interna
