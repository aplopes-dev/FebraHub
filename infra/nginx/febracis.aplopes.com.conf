# febracis.aplopes.com — FebraHub
#
# O Nginx do host termina o TLS e encaminha para os containers, que escutam só
# em 127.0.0.1. O Postgres não publica porta nenhuma. O MinIO publica só em
# 127.0.0.1:9014, e apenas porque a URL assinada de download precisa sair pelo
# domínio público — o console dele (9001) continua inacessível de fora.

upstream febrahub_api {
    server 127.0.0.1:3261;
    keepalive 32;
}

upstream febrahub_web {
    server 127.0.0.1:3260;
    keepalive 32;
}

# Cache dos assets com hash no nome (/_next/static): o conteúdo nunca muda
# para uma mesma URL, então pode ser imutável por um ano.
map $sent_http_content_type $febrahub_cache {
    default                    "no-cache";
    ~image/                    "public, max-age=2592000";
    ~font/                     "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name febracis.aplopes.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot-febrahub;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name febracis.aplopes.com;

    ssl_certificate     /etc/letsencrypt/live/febracis.aplopes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/febracis.aplopes.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/febrahub_access.log;
    error_log  /var/log/nginx/febrahub_error.log;

    # HSTS só depois que o HTTPS está confirmado — ligar antes tranca o
    # domínio no navegador de quem visitou enquanto estava quebrado.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Acompanha o UPLOAD_MAX_BYTES da API (25 MB) com folga para o envelope
    # do multipart. Menor que isso e o upload morre no Nginx, antes de a API
    # poder responder um erro que faça sentido.
    client_max_body_size 30M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml font/woff font/woff2;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # ---------------- API ----------------
    location /api/ {
        proxy_pass http://febrahub_api;
        proxy_set_header Connection "";

        # As views maiores levam alguns segundos na primeira execução fria;
        # 60s é folga suficiente sem segurar conexão morta.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Resposta de dados chega em uma tacada; buffer maior evita gravar
        # em disco temporário a cada consulta grande.
        proxy_buffering on;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;

        # Nada de cache: são dados por sessão, e a resposta muda com o perfil.
        add_header Cache-Control "no-store" always;
    }

    # Upload precisa de mais tempo e não pode ser bufferizado inteiro.
    location /api/arquivos {
        proxy_pass http://febrahub_api;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    # ---------------- MinIO (download por URL assinada) ----------------
    # O caminho é o do bucket, sem prefixo, porque a assinatura S3 v4 cobre
    # host + path: reescrever qualquer um dos dois invalida a URL. O bucket é
    # privado, então sem assinatura válida o MinIO responde 403 — expor este
    # location não abre nada, é o mesmo modelo do S3.
    location /febrahub/ {
        proxy_pass http://127.0.0.1:9014;
        proxy_set_header Connection "";
        proxy_buffering off;          # arquivo grande não precisa passar por buffer
        proxy_read_timeout 300s;
        client_max_body_size 30M;
        # O MinIO devolve os próprios headers de cache e de conteúdo.
        add_header Cache-Control "private, max-age=60" always;
    }

    # ---------------- assets do Next ----------------
    location /_next/static/ {
        proxy_pass http://febrahub_web;
        proxy_set_header Connection "";
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /_next/image {
        proxy_pass http://febrahub_web;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ---------------- frontend ----------------
    location / {
        proxy_pass http://febrahub_web;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        add_header Cache-Control $febrahub_cache;
    }
}
